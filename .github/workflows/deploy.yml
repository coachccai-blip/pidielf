# Construit, teste et publie PidiElf sur GitHub Pages à chaque envoi sur main.
# Réglage requis une seule fois : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # L'application vit dans un sous-dossier portant le nom du dépôt.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Construction
        run: npm run build
      - name: Tests de parcours (mobile et bureau)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Contrôle de l'artefact à publier
        run: |
          grep -q precache dist/sw.js
          test -s dist/index.html
          test -s dist/manifest.webmanifest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
